{% extends 'flight/layout.html' %}

{% block body %}
    <h2>Comments</h2>
    <ul>
        {% for comment in comments %}
            <li>{{ comment }}</li>
        {% endfor %}
    </ul>


    <h2>add comment</h2>
        
        <form method="post" class="comment-form">
            {% csrf_token %}
            {{ form }}
            <button type="submit">⩥</button>
        </form>
        <a href="{% url 'user_section' %}">Back To user</a>
{% endblock %}
